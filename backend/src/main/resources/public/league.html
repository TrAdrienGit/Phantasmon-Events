<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="League · Village 14">Ligue · Village 14</title>
<link rel="icon" href="/site/logo.png">
<style>
  :root {
    --bg: #101214; --bg2: #15181b; --panel: #1b1f23; --panel2: #22272c; --line: #2c3238; --ink: #eef1f3; --muted: #9aa4ad;
    --dim: #6c757d; --accent: #38c4bc; --accent-ink: #062b29; --gold: #ffd84a; --silver: #d8dee6; --violet: #a98bff;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 6px 18px rgba(0,0,0,.25);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f5f7; --bg2: #e9edf1; --panel: #ffffff; --panel2: #f6f8fa; --line: #dde3e9; --ink: #182026; --muted: #5b6672;
      --dim: #8a949e; --accent: #11968f; --accent-ink: #ffffff; --gold: #b88a00; --silver: #7d8a98; --violet: #7b55e0;
      --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  main.wrap { padding: 24px 16px 64px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 40px 0 14px; }
  .empty { color: var(--muted); }

  /* Hero */
  .hero { position: relative; overflow: hidden; border-radius: 18px; padding: 32px; border: 1px solid var(--line); display: flex; gap: 28px; align-items: center;
          background: radial-gradient(120% 140% at 0% 0%, rgba(56,196,188,.22), transparent 55%),
                      radial-gradient(120% 140% at 100% 100%, rgba(169,139,255,.22), transparent 55%), var(--panel); box-shadow: var(--shadow); }
  .emblem { width: 132px; height: 132px; flex: none; border-radius: 22px; display: grid; place-items: center; position: relative; overflow: hidden;
            border: 2px dashed var(--line); color: var(--dim); font-size: 12px; text-align: center; background: rgba(0,0,0,.12); }
  .emblem.has { border: 0; background: none; }
  .emblem img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .hero h1 { font-size: 44px; line-height: 1.05; margin: 0; letter-spacing: -.02em; }
  .hero p { color: var(--muted); max-width: 700px; margin: 12px 0 0; font-size: 16px; }
  @media (max-width: 640px) { .hero { padding: 22px 18px; flex-direction: column; align-items: flex-start; gap: 16px; } .emblem { width: 96px; height: 96px; } .hero h1 { font-size: 32px; } }

  .notice { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; font-size: 14px;
            background: rgba(255,216,74,.12); border: 1px solid rgba(255,216,74,.45); color: var(--ink); }
  .notice::before { content: "!"; flex: none; width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; font-weight: 800; background: var(--gold); color: #1b1f23; }

  /* The two paths */
  .paths { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 860px) { .paths { grid-template-columns: 1fr; } }
  .pathbox { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .pathbox::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--accent); }
  .pathbox.league::before { background: linear-gradient(90deg, var(--silver), var(--gold)); }
  .pathbox .step { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pathbox h3 { margin: 4px 0 0; font-size: 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pathbox h3 .hard { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: rgba(229,83,75,.15); color: #ff7b72; }
  .pathbox p { color: var(--muted); margin: 10px 0 0; font-size: 14px; }
  .badges { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
  @media (max-width: 520px) { .badges { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .badge { aspect-ratio: 1; border-radius: 999px; display: grid; place-items: center; background: var(--panel2); border: 2px dashed var(--line); }
  .badge.on { border: 2px solid var(--t); background: color-mix(in srgb, var(--t) 18%, var(--panel2)); }
  .badge .ti { width: 60%; height: 60%; }
  .chain { display: flex; align-items: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .chain span { padding: 6px 12px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--silver); font-weight: 600; font-size: 13px; }
  .chain span.champ { border-color: var(--gold); color: var(--gold); }
  .chain i { color: var(--dim); font-style: normal; }

  /* How it works */
  .how { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .how div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
  .how b { font-size: 16px; }
  .how p { color: var(--muted); margin: 8px 0 0; font-size: 14px; }
  .how code { font-size: 13px; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }

  /* Type icons: Cobblemon's sheet, 18 icons of 36 px */
  .ti { display: inline-block; width: 22px; height: 22px; flex: none; background: url(/site/types.png) no-repeat; background-size: 1800% 100%;
        background-position: calc(var(--i) * 100% / 17) 0; image-rendering: pixelated; }

  /* Trainer cards */
  .trainers { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .trainers { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 820px) { .trainers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 520px) { .trainers { grid-template-columns: 1fr; } }
  .trainer { --t: var(--dim); position: relative; overflow: hidden; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--t) 55%, var(--line));
             background: linear-gradient(160deg, color-mix(in srgb, var(--t) 30%, var(--panel)) 0%, var(--panel) 62%); box-shadow: var(--shadow);
             display: flex; gap: 12px; padding: 14px; }
  .trainer.vacant { opacity: .55; }
  .trainer.champion { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), var(--shadow); }
  .skin { width: 64px; height: 128px; flex: none; position: relative; align-self: center; display: grid; place-items: center; }
  .skin img { width: 64px; height: 128px; image-rendering: pixelated; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
  .skin svg { width: 46px; height: 100px; fill: color-mix(in srgb, var(--t) 40%, var(--panel2)); }
  .trainer .info { min-width: 0; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .trainer .rank { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .trainer .name { font-weight: 800; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trainer .disc { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 5px; min-width: 0; }
  .trainer .disc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trainer .disc svg { width: 14px; height: 14px; fill: #8c9eff; flex: none; }
  .trainer .type { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; margin-top: 4px; }
  .trainer .type .ti { width: 20px; height: 20px; }
  .meta { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; font-size: 13px; color: var(--muted); }
  .meta div { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .meta svg { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .meta a.field { color: var(--violet); font-weight: 600; }
  .meta a.field:hover { text-decoration: underline; }
  .coords { font-family: ui-monospace, Consolas, monospace; color: var(--ink); cursor: pointer; background: none; border: 0; padding: 0; font-size: 13px; white-space: nowrap; }
  .coords:hover { color: var(--accent); }
  .badge-name { font-style: italic; }
  .champ-wrap { display: flex; justify-content: center; margin-top: 14px; }
  .champ-wrap .trainer { width: min(100%, 380px); }
  .members { display: flex; flex-wrap: wrap; gap: 8px; }
  .member { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; }
  .face { width: 28px; height: 28px; flex: none; border-radius: 999px; background: var(--panel2); display: grid; place-items: center;
          font-weight: 800; font-size: 12px; color: var(--muted); overflow: hidden; position: relative; }
  .face img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .member small { color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent); border-radius: 999px;
           padding: 8px 16px; font-size: 14px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  /* Field change graphs */
  .glegend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .glegend span { font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .glegend b { color: var(--accent); }
  .glegend .dashl { display: inline-block; width: 26px; vertical-align: middle; border-top: 2px dashed var(--dim); }
  .graphs { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 540px), 1fr)); margin-top: 14px; }
  .graph { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .graph.wide { grid-column: 1 / -1; }
  .graph h3 { margin: 0 0 8px; font-size: 16px; }
  .graph > p { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
  .graph .scroll { overflow-x: auto; }
  .graph svg { display: block; width: 100%; height: auto; }
  .graph.wide svg { max-width: 900px; margin: 0 auto; }
  .graph svg .e { fill: none; stroke: var(--dim); stroke-width: 1.6; }
  .graph svg .e.dash { stroke-dasharray: 6 4; }
  .graph svg .ah, .graph svg .dot { fill: var(--dim); }
  .graph svg .lbl { font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--muted); text-anchor: middle; }
  .graph svg .lbl.halo { paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; }
  .graph svg .grp { fill: var(--accent); font-weight: 700; }
  .graph svg .n rect { fill: var(--panel2); stroke: var(--violet); stroke-width: 1.4; }
  .graph svg .n text { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .graph svg a.n:hover rect, .graph svg a.n:focus rect { fill: color-mix(in srgb, var(--violet) 22%, var(--panel2)); }
  .graph svg .n.none rect { stroke: var(--dim); stroke-dasharray: 4 3; }
  .graph svg .n.hub rect { stroke: var(--gold); }
  .gnotes { color: var(--muted); font-size: 14px; margin: 14px 0 0; padding-left: 18px; display: grid; gap: 4px; }

  /* Field wiki */
  .wiki-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
  .wiki-head p { color: var(--muted); margin: 0; max-width: 720px; font-size: 14px; }
  .search { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 240px; }
  .search:focus { outline: none; border-color: var(--violet); }
  .fields { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  details.field { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  details.field[open] { border-color: var(--violet); }
  details.field summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  details.field summary::-webkit-details-marker { display: none; }
  details.field summary::before { content: ""; width: 7px; height: 7px; border: solid var(--violet); border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform .15s; flex: none; }
  details.field[open] summary::before { transform: rotate(45deg); }
  details.field summary b { font-size: 16px; }
  details.field summary span { color: var(--muted); font-size: 13px; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fbody { padding: 0 16px 16px 35px; display: grid; gap: 14px; }
  .fbody h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .fbody ul { margin: 0; padding-left: 18px; } .fbody li { margin: 2px 0; font-size: 14px; }
  .fbody .note { background: rgba(169,139,255,.08); border-left: 3px solid var(--violet); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 14px; }
  .mult { font-weight: 700; } .mult.up { color: #4cd07d; } .mult.down { color: #e5534b; }
  .credit { color: var(--dim); font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
<!--SITE_HEADER page="league"--><!--/SITE_HEADER-->
<main class="wrap" id="app"><p class="empty" data-en="Loading…">Chargement…</p></main>
<script>
(() => {
  const lang = window.SITE_LANG;
  const tx = v => v == null ? '' : typeof v === 'string' ? v : (v[lang] ?? v.fr ?? '');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  // Types: their Cobblemon icon (index in the sheet), colour and names; the JSON may name them in French or English.
  const TYPE_LIST = [['normal', 'Normal', 'Normal', '#9fa19f'], ['fire', 'Feu', 'Fire', '#e62829'], ['water', 'Eau', 'Water', '#2980ef'],
    ['grass', 'Plante', 'Grass', '#3fa129'], ['electric', 'Électrik', 'Electric', '#d4ac00'], ['ice', 'Glace', 'Ice', '#3dcef3'],
    ['fighting', 'Combat', 'Fighting', '#ff8000'], ['poison', 'Poison', 'Poison', '#9141cb'], ['ground', 'Sol', 'Ground', '#915121'],
    ['flying', 'Vol', 'Flying', '#81b9ef'], ['psychic', 'Psy', 'Psychic', '#ef4179'], ['bug', 'Insecte', 'Bug', '#91a119'],
    ['rock', 'Roche', 'Rock', '#afa981'], ['ghost', 'Spectre', 'Ghost', '#704170'], ['dragon', 'Dragon', 'Dragon', '#5060e1'],
    ['dark', 'Ténèbres', 'Dark', '#624d4e'], ['steel', 'Acier', 'Steel', '#60a1b8'], ['fairy', 'Fée', 'Fairy', '#ef70ef']];
  const flat = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  const TYPES = {};
  TYPE_LIST.forEach(([id, fr, en, color], i) => { const t = { i, fr, en, color }; TYPES[id] = TYPES[flat(fr)] = TYPES[flat(en)] = t; });
  TYPES.electrique = TYPES.electric;
  const typeOf = v => TYPES[flat(v)] || null;
  const typeIcon = t => t ? `<span class="ti" style="--i:${t.i}" role="img" aria-label="${esc(L(t.fr, t.en))}"></span>` : '';
  const DISCORD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4a13 13 0 0 1-2 1l1.3 2a19.8 19.8 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7zM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>';
  const ICON = {
    pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    server: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>',
    field: '<svg viewBox="0 0 24 24"><path d="M3 17l5-8 4 5 3-4 6 7z"/><path d="M3 20h18"/></svg>',
    badge: '<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>',
  };
  const SILHOUETTE = '<svg viewBox="0 0 16 32" aria-hidden="true"><path d="M4 0h8v8H4zM4 8h8v12H4zM0 8h4v12H0zM12 8h4v12h-4zM4 20h4v12H4zM8 20h4v12H8z"/></svg>';
  let fieldNames = {};
  let defaultServer = 'Wild 14';

  const face = p => {
    const n = p.minecraft || p.discord || '?';
    const img = p.minecraft ? `<img src="/public/heads/${encodeURIComponent(p.minecraft)}" alt="" loading="lazy" onerror="this.remove()">` : '';
    return `<span class="face">${esc(n[0].toUpperCase())}${img}</span>`;
  };
  const coordsText = c => {
    const n = String(c || '').match(/-?\d+(?:\.\d+)?/g);
    return n && n.length === 3 ? `X ${n[0]} · Y ${n[1]} · Z ${n[2]}` : n && n.length === 2 ? `X ${n[0]} · Z ${n[1]}` : String(c || '');
  };
  const trainer = (p, rank, extra = '') => {
    const vacant = !p.discord && !p.minecraft;
    const t = typeOf(p.type);
    const name = p.minecraft || p.discord || L('Place libre', 'Open seat');
    const skin = p.minecraft ? `<img src="/public/skins/${encodeURIComponent(p.minecraft)}" alt="" loading="lazy" onerror="this.replaceWith(document.createRange().createContextualFragment(window.SILHOUETTE))">` : SILHOUETTE;
    const meta = [];
    if (p.field) meta.push(`<div>${ICON.field}<a class="field" href="#field-${esc(p.field)}" data-open="${esc(p.field)}">${esc(fieldNames[p.field] || p.field)}</a></div>`);
    if (tx(p.badge)) meta.push(`<div>${ICON.badge}<span class="badge-name">${esc(tx(p.badge))}</span></div>`);
    if (p.coords) meta.push(`<div>${ICON.pin}<button class="coords" data-copy="${esc((String(p.coords).match(/-?\d+(?:\.\d+)?/g) || [p.coords]).join(' '))}" title="${L('Copier', 'Copy')}">${esc(coordsText(p.coords))}</button></div>`);
    if (!vacant) meta.push(`<div>${ICON.server}<span>${esc(p.server || defaultServer)}</span></div>`);
    return `<div class="trainer ${vacant ? 'vacant' : ''} ${extra}" style="${t ? `--t:${t.color}` : ''}"><div class="skin">${skin}</div><div class="info">
      <div class="rank">${esc(rank)}</div><div class="name">${esc(name)}</div>
      ${p.discord ? `<div class="disc">${DISCORD}<span>${esc(p.discord)}</span></div>` : ''}
      ${t ? `<div class="type">${typeIcon(t)}${esc(L(t.fr, t.en))}</div>` : ''}
      ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}</div></div>`;
  };
  window.SILHOUETTE = SILHOUETTE;

  function fieldHtml(f, notes) {
    const pct = m => { const up = m > 1; return `<span class="mult ${up ? 'up' : m < 1 ? 'down' : ''}">×${String(m).replace('.', L(',', '.'))}</span>`; };
    const sec = (title, items) => items.length ? `<div><h4>${title}</h4><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>` : '';
    const note = notes[f.id] ? `<div class="note">${esc(tx(notes[f.id]))}</div>` : '';
    const types = f.types.map(t => `${L('Capacités', 'Moves')} ${esc(tx(t.type))} ${pct(t.mult)}${t.cond ? ` (${esc(tx(t.cond))})` : ''}`);
    const boosts = f.boosts.map(b => `${esc(tx(b.move))}${b.mult != null ? ` ${pct(b.mult)}` : ''}${b.mult === 0 ? ` (${L('échoue', 'fails')})` : ''}${b.type ? ` · ${L('devient aussi', 'also becomes')} ${esc(tx(b.type))}` : ''}`);
    const acc = f.accuracy.map(a => `${esc(tx(a.move))} : ${L('précision', 'accuracy')} ${a.acc} %`);
    const changes = f.changes.map(c => `${c.moves.map(m => esc(tx(m))).join(', ')} → <b>${esc(tx(c.to))}</b>`);
    const misc = [];
    if (f.naturePower) misc.push(`${L('Force Nature devient', 'Nature Power becomes')} <b>${esc(tx(f.naturePower))}</b>`);
    if (f.mimicry) misc.push(`${L('Mimétisme donne le type', 'Mimicry gives the type')} <b>${esc(tx(f.mimicry))}</b>`);
    if (f.statusMods.length) misc.push(`${L('Capacités de statut renforcées', 'Boosted status moves')} : ${f.statusMods.map(m => esc(tx(m))).join(', ')}`);

  // A fan: each source on its own row, its arrow joining a bus that leads to one target (or one source to many).
  function fan(sources, target, { w = 780, row = 40, top = 34, srcX = 100, busX = 610, tgtX = 700, out = false, dash = false } = {}) {
    const h = top * 2 + row * (sources.length - 1);
    const mid = top + row * (sources.length - 1) / 2;
    const nodes = [N(target.k, out ? srcX : tgtX, mid, target)];
    const edges = [];
    sources.forEach(([k, l, o = {}], i) => {
      const y = top + row * i;
      const key = k + '#' + i;
      nodes.push(N(key, out ? tgtX : srcX, y, { f: k, ...o }));
      edges.push(out ? E([busX, y], key, l, { above: true, dash }) : E(key, [busX, y], l, { above: true, arrow: false, dash }));
    });
    edges.push(out ? E(target.k, [busX, mid], '', { arrow: false, dash }) : E([busX, mid], target.k, '', { dash }));
    edges.push(E([busX, top], [busX, top + row * (sources.length - 1)], '', { arrow: false, dash }));
    return { w, h, nodes, edges, dots: [[busX, mid]] };
  }

  function nodeName(n) {
    if (n.label) return tx(n.label);
    const f = n.f || n.k;
    if (f === 'indoor') return L('Sans terrain', 'No field');
    if (f === 'any') return L('N\'importe quel terrain', 'Any field');
    return fieldNames[f] || f;
  }

  function labelLines(l) {
    return (typeof l === 'string' ? l : tx(l)).split('\n').map(line => line.split(/(\{@?[a-z0-9]+\})/).filter(Boolean).map(p => {
      const m = p.match(/^\{(@?)([a-z0-9]+)\}$/);
      if (!m) return { t: p };
      return m[1] ? { t: tx(GROUPS[m[2]][0]), g: true } : { t: tx(MOVES[m[2]]) || m[2] };
    }));
  }

  function graphSvg(g, gi) {
    const nodes = {};
    g.nodes.forEach(n => { const name = nodeName(n); nodes[n.k] = { ...n, name, w: Math.max(64, measure(name, `600 13px ${GRAPH_FONT}`) + 24), h: 30 }; });
    const at = p => typeof p === 'string' ? nodes[p] : { x: p[0], y: p[1], point: true };
    const clip = (n, p) => {
      if (n.point) return [n.x, n.y];
      const dx = p[0] - n.x, dy = p[1] - n.y, hw = n.w / 2 + 4, hh = n.h / 2 + 4;
      const s = Math.min(hw / Math.max(Math.abs(dx), 1e-6), hh / Math.max(Math.abs(dy), 1e-6));
      return [n.x + dx * s, n.y + dy * s];
    };
    const f1 = v => Math.round(v * 10) / 10;
    const lines = [], labels = [];
    for (const e of g.edges) {
      const A = at(e.a), B = at(e.b);
      let d, lp;
      if (e.bend) {
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, len = Math.hypot(B.x - A.x, B.y - A.y);
        const c = [mx - (B.y - A.y) / len * e.bend, my + (B.x - A.x) / len * e.bend];
        const s = clip(A, c), t = clip(B, c);
        d = `M${f1(s[0])} ${f1(s[1])}Q${f1(c[0])} ${f1(c[1])} ${f1(t[0])} ${f1(t[1])}`;
        lp = [(s[0] + 2 * c[0] + t[0]) / 4, (s[1] + 2 * c[1] + t[1]) / 4];
      } else {
        const pts = [[A.x, A.y], ...(e.via || []), [B.x, B.y]];
        const s = clip(A, pts[1]), t = clip(B, pts[pts.length - 2]);
        const all = [s, ...pts.slice(1, -1), t];
        d = 'M' + all.map(p => `${f1(p[0])} ${f1(p[1])}`).join('L');
        lp = e.lp || [(all[0][0] + all[1][0]) / 2, (all[0][1] + all[1][1]) / 2];
      }
      lines.push(`<path class="e${e.dash ? ' dash' : ''}" d="${d}"${e.arrow === false ? '' : ` marker-end="url(#ah${gi})"`}/>`);
      if (!e.l) continue;
      const ls = labelLines(e.l);
      const y0 = e.above ? lp[1] - 7 - (ls.length - 1) * 15 : lp[1] - (ls.length - 1) * 7.5 + 4;
      ls.forEach((parts, i) => labels.push(`<text class="lbl${e.above ? '' : ' halo'}" x="${f1(lp[0])}" y="${f1(y0 + i * 15)}">${parts.map(p => p.g ? `<tspan class="grp">${esc(p.t)}</tspan>` : esc(p.t)).join('')}</text>`));
    }
    const boxes = Object.values(nodes).filter(n => !n.point).map(n => {
      const f = n.f || n.k;
      const cls = `n${n.none ? ' none' : ''}${n.hub ? ' hub' : ''}`;
      const body = `<rect x="${f1(n.x - n.w / 2)}" y="${n.y - n.h / 2}" width="${f1(n.w)}" height="${n.h}" rx="8"/><text x="${n.x}" y="${n.y}">${esc(n.name)}</text>`;
      return fieldNames[f] ? `<a class="${cls}" href="#field-${esc(f)}" data-open="${esc(f)}">${body}</a>` : `<g class="${cls}">${body}</g>`;
    });
    const dots = (g.dots || []).map(([x, y]) => `<circle class="dot" cx="${x}" cy="${y}" r="3.5"/>`);
    return `<svg viewBox="0 0 ${g.w} ${g.h}" style="min-width:${Math.round(g.w * 0.72)}px" role="img" aria-label="${esc(tx(g.title))}">
      <defs><marker id="ah${gi}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
      ${lines.join('')}${labels.join('')}${boxes.join('')}${dots.join('')}</svg>`;
  }

  function graphsHtml() {
    const cards = GRAPHS.map((g, i) => `<div class="graph${g.wide ? ' wide' : ''}"><h3>${esc(tx(g.title))}</h3>
      ${g.temp ? `<p>${L('Ces terrains sont temporaires : ils se posent sur le terrain du combat et le lui rendent quand leurs tours sont écoulés.',
        'These fields are temporary: they settle on the battle\'s field and give it back when their turns run out.')}</p>` : ''}
      <div class="scroll">${graphSvg(g, i)}</div></div>`).join('');
    const groups = Object.values(GROUPS).map(([name, ids]) => `<span><b>${esc(tx(name))}</b> : ${ids.split(' ').map(id => esc(tx(MOVES[id]))).join(', ')}</span>`).join('');
    const notes = [
      L('Avec Amplifield Rock ou Terrain Extender, les champs posés par une capacité durent 8 tours au lieu de 5 (le double pour les autres).',

    return `<h2>${L('Transformations des terrains', 'Field changes')}</h2>
      <div class="wiki-head"><p>${L('Certaines capacités changent le terrain du combat. Chaque flèche part du terrain actuel et mène au terrain qu\'il devient. Clique sur un terrain pour ouvrir sa fiche dans le wiki.',
        'Some moves change the battle\'s field. Each arrow leads from the current field to the field it becomes. Click a field to open its page in the wiki.')}</p></div>
      <div class="glegend"><span><b>×2</b> : ${L('la capacité doit être utilisée deux fois (elles se cumulent : une fois, puis une capacité sans ×2, suffit aussi)', 'the move must be used twice (they add up: once, then a move without ×2, is enough too)')}</span>
        <span><i class="dashl"></i> ${L('par la météo ou pour quelques tours', 'by the weather or for a few turns')}</span>${groups}</div>
      <div class="graphs">${cards}</div>
      <ul class="gnotes">${notes.map(n => `<li>${n}</li>`).join('')}</ul>`;
  }

  function render(data, fields) {
    fieldNames = Object.fromEntries(fields.map(f => [f.id, tx(f.name)]));
    defaultServer = data.defaultServer || defaultServer;
    document.title = `${tx(data.name)} · Village 14`;
    const gyms = data.gyms || [];
    const elite = data.elite || [];
    const how = (data.how || []).map(h => `<div><b>${esc(tx(h.title))}</b><p>${esc(tx(h.text)).replace(/(\/dresseurs [a-z-]+)/g, '<code>$1</code>')}</p></div>`).join('');
    const notes = data.fieldNotes || {};
    const badges = gyms.map(g => { const t = typeOf(g.type); return t ? `<span class="badge on" style="--t:${t.color}" title="${esc(L(t.fr, t.en))}">${typeIcon(t)}</span>` : '<span class="badge"></span>'; }).join('');
    document.getElementById('app').innerHTML = `
      ${tx(data.notice) ? `<div class="notice">${esc(tx(data.notice))}</div>` : ''}
      <section class="hero"><div class="emblem" id="emblem"><span>${L('Icône de la ligue', 'League icon')}</span><img src="/league/icon" alt="" onload="this.parentNode.classList.add('has');this.previousElementSibling.remove()" onerror="this.remove()"></div>
        <div><h1>${esc(tx(data.name))}</h1><p>${esc(tx(data.tagline))}</p></div></section>
      <h2>${L('Le parcours', 'The path')}</h2>
      <div class="paths">
        <div class="pathbox"><div class="step">${L('Étape 1', 'Step 1')}</div><h3>${L(`Les ${gyms.length} badges`, `The ${gyms.length} badges`)}</h3>
          <p>${esc(tx(data.badgesPath))}</p><div class="badges">${badges}</div></div>
        <div class="pathbox league"><div class="step">${L('Étape 2', 'Step 2')}</div><h3>${L('La Ligue', 'The League')} <span class="hard">${L("D'une traite", 'In one go')}</span></h3>
          <p>${esc(tx(data.leaguePath))}</p>
          <div class="chain">${elite.map((e, i) => `<span>${L('Conseil', 'Elite')} ${i + 1}</span>`).join('<i>→</i>')}<i>→</i><span class="champ">${L('Maître', 'Champion')}</span></div></div>
      </div>
      <h2>${L('Comment ça marche', 'How it works')}</h2><div class="how">${how}</div>
      <h2>${L("Champions d'arène", 'Gym leaders')}</h2>
      <div class="trainers">${gyms.map(g => trainer({ ...g.leader, type: g.type, field: g.field, badge: g.badge, coords: g.coords, server: g.server }, L("Champion d'arène", 'Gym leader'))).join('')}</div>
      <h2>${L('Conseil 4 et Maître', 'Elite Four and Champion')}</h2>
      <div class="trainers">${elite.map((e, i) => trainer(e, `${L('Conseil 4', 'Elite Four')} · ${i + 1}`)).join('')}</div>
      <div class="champ-wrap">${trainer(data.champion || {}, L('Maître de la Ligue', 'League Champion'), 'champion')}</div>
      ${(data.members || []).length ? `<h2>${L('Membres', 'Members')}</h2><div class="members">${data.members.map(m => `<span class="member">${face(m)}
        <span>${esc(m.minecraft || m.discord)}${m.discord && m.minecraft ? ` <small>· ${esc(m.discord)}</small>` : ''}${m.role ? ` <small>· ${esc(tx(m.role))}</small>` : ''}</span></span>`).join('')}</div>` : ''}
      ${graphsHtml()}
      <h2>${L('Wiki des terrains', 'Field wiki')}</h2>
      <div class="wiki-head"><p>${L('Chaque terrain change les règles du combat : bonus de type, capacités renforcées ou transformées, et capacités qui changent le terrain lui-même. Ouvre un terrain pour voir ses effets.',
        'Each field changes the battle\'s rules: type boosts, stronger or changed moves, and moves that change the field itself. Open a field to see its effects.')}</p>
        <input class="search" id="search" type="search" placeholder="${L('Chercher un terrain, une capacité…', 'Search a field, a move…')}"></div>
      <div class="fields" id="fields">${fields.map(f => fieldHtml(f, notes)).join('')}</div>
      <p class="credit">${L('Terrains, chiffres et interactions repris de Pokémon Reborn, avec nos propres textes. Icônes de type : Cobblemon.', 'Fields, numbers and interactions taken from Pokémon Reborn, with our own texts. Type icons: Cobblemon.')}</p>
      <div class="toast" id="toast"></div>`;
    const search = document.getElementById('search');
    search.oninput = () => {
      const q = search.value.trim().toLowerCase();
      document.querySelectorAll('details.field').forEach(d => { d.style.display = !q || d.textContent.toLowerCase().includes(q) ? '' : 'none'; });
    };
    const open = id => { const d = document.getElementById('field-' + id); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); } };
    document.querySelectorAll('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); open(a.dataset.open); history.replaceState(null, '', '#field-' + a.dataset.open); });
    const toast = document.getElementById('toast');
    document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => {
      navigator.clipboard?.writeText(b.dataset.copy).then(() => {
        toast.textContent = L('Coordonnées copiées', 'Coordinates copied'); toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1400);
      }).catch(() => {});
    });
    if (location.hash.startsWith('#field-')) open(location.hash.slice(7));
  }

  Promise.all([fetch('/league/data', { cache: 'no-store' }).then(r => r.json()), fetch('/league/fields').then(r => r.json())])
    .then(([data, fields]) => render(data, fields))
    .catch(() => { document.getElementById('app').innerHTML = `<p class="empty">${L('La page de la Ligue n’a pas pu se charger.', 'The league page could not load.')}</p>`; });
})();
</script>
</body>
</html>
