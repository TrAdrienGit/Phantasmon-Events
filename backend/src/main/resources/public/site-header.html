<style>
  /* Village 14's header, shared by every page of the site (SitePages puts it in place of <!--SITE_HEADER-->). */
  .top { background: var(--bg2); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .top .wrap { display: flex; align-items: center; gap: 12px; height: 54px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; flex: none; white-space: nowrap; }
  .brand img { width: 28px; height: 28px; border-radius: 6px; }
  .site-nav { display: flex; gap: 2px; align-self: stretch; flex: none; margin-left: 8px; }
  .site-nav a { display: flex; align-items: center; padding: 0 12px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; }
  .site-nav a:hover { color: var(--ink); }
  .site-nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
  @media (max-width: 560px) { .brand span { display: none; } .site-nav { margin-left: 0; } .site-nav a { padding: 0 8px; } }
</style>
<header class="top"><div class="wrap">
  <a class="brand" href="/home"><img src="/site/logo.png" alt=""><span>Village 14</span></a>
  <nav class="site-nav"><a href="/home" data-page="home">Accueil</a><a href="/tournament" data-page="tournament">Tournoi</a><a href="/download" data-page="download">Téléchargement</a></nav>
  {{EXTRA}}
</div></header>
