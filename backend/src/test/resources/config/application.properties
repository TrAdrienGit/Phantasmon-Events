# Test-only overrides, layered over the core's application.properties (in the core's jar). Tests never download
# Showdown's data: they use the snapshot in the core's jar. Hub schematic folders go to the build directory.
phantasmon.showdown.update-on-start=false
phantasmon.hub.schematics-dir=build/test-hub_schematics
# The core reads these from its .env, which this module does not have: test-only values (Testcontainers replaces the
# datasource anyway).
phantasmon.jwt.secret=events-module-tests-only-secret-0123456789abcdef0123456789abcdef
BDD_USER=test
BDD_PASSWORD=test
LOGGING_ENABLED=false
