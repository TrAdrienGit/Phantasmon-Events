plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
	// Phantasmon and Cobblemon Spectacle: `./gradlew publishToMavenLocal` in their own folders puts them there.
	mavenLocal() {
		content {
			includeGroup "com.mystaria"
			includeGroup "com.mystaria.phantasmon"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Cobblemon 1.8.1 Fabric, by its Modrinth VERSION ID (same as Phantasmon).
	modImplementation "maven.modrinth:cobblemon:${project.cobblemon_version}"
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

	modImplementation "com.mystaria.phantasmon:phantasmon-client:${project.phantasmon_version}"
	modImplementation "com.mystaria:cobblemon-spectacle:${project.spectacle_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE", "NOTICE") {
		rename { "${it}_$projectName" }
	}
}
