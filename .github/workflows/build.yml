name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          # Loom needs a JDK 25 to run Gradle; the mod itself targets Java 21.
          java-version: '25'
          distribution: 'microsoft'
      # Phantasmon Events compiles against Cobblemon Spectacle and Phantasmon, from Maven local.
      - name: checkout Cobblemon Spectacle
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/Cobblemon-Spectacle
          path: Cobblemon-Spectacle
      - name: publish Cobblemon Spectacle to Maven local
        working-directory: Cobblemon-Spectacle
        run: chmod +x ./gradlew && ./gradlew publishToMavenLocal
      - name: checkout Phantasmon
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/Phantasmon-Client
          path: Phantasmon-Client
          ref: dev
      - name: publish Phantasmon to Maven local
        working-directory: Phantasmon-Client
        run: chmod +x ./gradlew && ./gradlew publishToMavenLocal
      - name: build
        run: chmod +x ./gradlew && ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
